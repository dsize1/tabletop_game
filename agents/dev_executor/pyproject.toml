[project]
name = "dev-executor"
version = "0.1.0"
description = "dev 任务执行器（LangGraph，shadow 阶段）：状态编排 + 人工中断恢复；不直连 tabletop.db"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0.0",
  "langgraph-checkpoint-sqlite>=3.0.0",
]

[project.optional-dependencies]
# DeepAgents harness（B6.2 接入；先不装，避免 shadow 阶段引入额外依赖）
agents = [
    "deepagents>=0.3.0",
]
llm = [
    "langchain-openai>=1.7.2",
]

[project.scripts]
dev-executor = "dev_executor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_executor"]
