[workspace]
resolver = "2"
members = [
    "shared",
    "bot-adapter",
    "command-router",
    "game-engine-core",
    "engines/las-vegas",
    "engines/rock-paper-scissors",
    "game-engine-mcp",
    "dev-task",
    "dev-task-mcp",
    "docs-mcp",
    "storage",
    "auth",
    "push",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
redis = { version = "0.25.5", features = ["tokio-comp", "streams", "connection-manager"] }
rand = "0.8.8"
rmcp = { version = "3.5.1", features = ["transport-io"] }
schemars = { version = "1", features = ["derive"] }
rusqlite = { version = "0.34.0", features = ["bundled"] }
